<text x="600" y="28" fill="#8b949e" font-size="15" text-anchor="middle">github.com/panhavad/database-backup-automation-service-generator</text>
<rect x="40" y="76" width="6" height="58" rx="3" fill="#89e051"/>
<text x="62" y="118" fill="#f0f6fc" font-size="40" font-weight="700">Database Backup Automation Service Generator</text>
<text x="62" y="168" fill="#c9d1d9" font-size="20">Bash generator for automatic PostgreSQL database backups - creates pg_dump script plus</text>
<text x="62" y="198" fill="#c9d1d9" font-size="20">systemd service and timer in one interactive run.</text>
<rect x="40" y="270" width="520" height="330" rx="12" fill="#0d1117" stroke="#30363d"/>
<text x="62" y="302" fill="#8b949e" font-size="15" font-weight="600">PROJECT STRUCTURE</text>
<text x="62" y="334" fill="#7ee787" font-size="17" font-family="Consolas, monospace">├── README.md</text>
<text x="62" y="361" fill="#7ee787" font-size="17" font-family="Consolas, monospace">└── service-init.sh</text>
