<text x="874" y="366" fill="#e6edf3" font-size="15" text-anchor="middle">+ names</text>
<path d="M956 350 h18" stroke="#8b949e" stroke-width="2"/><path d="M974 350 l-7 -5 v10 z" fill="#8b949e"/>
<rect x="976" y="322" width="160" height="56" rx="10" fill="#161b22" stroke="#89e051"/>
<text x="1056" y="346" fill="#e6edf3" font-size="15" text-anchor="middle">Generate backup-</text>
