<rect x="976" y="408" width="160" height="56" rx="10" fill="#161b22" stroke="#89e051"/>
<text x="1056" y="432" fill="#e6edf3" font-size="15" text-anchor="middle">/etc/dbbackup/DB_BA</text>
<text x="1056" y="452" fill="#e6edf3" font-size="15" text-anchor="middle">KUP</text>
